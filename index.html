<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>重返2026：大屏控台 (房主端)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen p-4 md:p-6 select-none font-sans">

  <!-- 顶部状态栏 -->
  <header class="flex justify-between items-center bg-stone-900 p-4 rounded-2xl border border-stone-800 mb-4">
    <div>
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-black text-amber-500">重返 2026 · 大屏幕控台</h1>
        <span class="text-xs bg-amber-950 text-amber-400 font-bold px-3 py-1 rounded-full border border-amber-800">
          房间码：<b id="roomCodeDisplay" class="text-white tracking-widest text-sm">----</b>
        </span>
      </div>
      <p class="text-xs text-stone-400 mt-1">玩家请在手机打开 player.html 输入此房间码同步联机</p>
    </div>
    <div class="flex items-center gap-3">
      <div class="text-right">
        <div class="text-[10px] text-stone-400">集市历法</div>
        <div id="dayDisplay" class="text-xl font-black text-amber-400">第 1 天</div>
      </div>
      <button onclick="nextDay()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition shadow">
        结算进入下一天 ➔
      </button>
    </div>
  </header>

  <main class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- 玩家资产大盘 -->
    <section class="lg:col-span-2 space-y-4">
      <div class="bg-stone-900 p-4 rounded-2xl border border-stone-800">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-base font-bold text-amber-400">已联机玩家列表</h2>
          <span id="turnNotice" class="text-xs text-stone-400"></span>
        </div>
        <div id="playerList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div class="col-span-2 text-center py-8 text-xs text-stone-500 border border-dashed border-stone-800 rounded-xl">
            等待玩家手机端加入中...
          </div>
        </div>
      </div>

      <!-- 快捷调整/剧情广播提示 -->
      <div class="bg-stone-900 p-4 rounded-2xl border border-stone-800 text-xs text-stone-400 space-y-2">
        <div class="font-bold text-amber-400 text-sm">💡 联机同步机制说明</div>
        <p>1. 只要大屏幕上的物价波动、禁售商品或玩家资产变动，所有玩家手机端会瞬间自动刷新同步。</p>
        <p>2. 玩家在各自手机上点击“买入”或“卖出”，大屏幕会立即听到清脆铜钱声并同步更新账本。</p>
      </div>
    </section>

    <!-- 市场大盘行情 -->
    <section class="space-y-4">
      <div class="bg-stone-900 p-4 rounded-2xl border border-stone-800">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-base font-bold text-amber-400">今日全城牌价</h2>
          <span id="bannedBadge" class="text-xs bg-rose-950 text-rose-300 px-2 py-0.5 rounded border border-rose-800">禁售: 无</span>
        </div>
        <div id="marketList" class="space-y-2"></div>
      </div>
    </section>
  </main>

  <script>
    // ！！！请填入你的 Supabase 配置！！！
    const SUPABASE_URL = "https://gyjkfpzgjjauasrqsosv.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5amtmcHpnamphdWFzcnFzb3N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1Mjk2ODEsImV4cCI6MjEwNDEwNTY4MX0.MUqPH0bWYjSnI9gpkwVhVz3wj8UuHsGvt9WDd1SEZHo";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ROOM_ID = "2026"; // 默认房间号，也可改为随机数
    let roomChannel = null;

    let currentDay = 1;
    let bannedItemId = null;
    let players = [];

    const baseItems = [
      { id: "millet", name: "小米", icon: "🌾", min: 1, max: 4, price: 2, note: "" },
      { id: "dates", name: "枣", icon: "🍒", min: 2, max: 7, price: 4, note: "" },
      { id: "salt", name: "粗盐", icon: "🧂", min: 4, max: 15, price: 8, note: "" },
      { id: "chicken", name: "鸡", icon: "🐓", min: 6, max: 20, price: 12, note: "" },
      { id: "wine", name: "米酒", icon: "🍶", min: 10, max: 35, price: 20, note: "" },
      { id: "cloth", name: "麻布", icon: "🧣", min: 18, max: 60, price: 35, note: "" },
      { id: "mirror", name: "铜镜", icon: "🪞", min: 30, max: 100, price: 60, note: "" },
      { id: "silk", name: "丝绸", icon: "👘", min: 40, max: 180, price: 100, note: "" }
    ];

    function init() {
      document.getElementById('roomCodeDisplay').innerText = ROOM_ID;
      randomizeMarket();
      renderAll();

      // 加入 Supabase 实时广播房间
      roomChannel = supabase.channel(`room_${ROOM_ID}`, {
        config: { broadcast: { self: false } }
      });

      // 监听玩家加入或操作
      roomChannel
        .on('broadcast', { event: 'PLAYER_JOIN' }, ({ payload }) => {
          let p = players.find(x => x.name === payload.name);
          if (!p) {
            players.push({
              name: payload.name,
              coins: 30,
              role: "normal",
              inventory: {}
            });
          }
          broadcastFullState();
          renderAll();
        })
        .on('broadcast', { event: 'PLAYER_BUY' }, ({ payload }) => {
          handleBuy(payload.playerName, payload.itemId);
        })
        .on('broadcast', { event: 'PLAYER_SELL' }, ({ payload }) => {
          handleSell(payload.playerName, payload.itemId);
        })
        .subscribe();
    }

    function randomizeMarket() {
      baseItems.forEach(item => {
        item.price = Math.floor(Math.random() * (item.max - item.min + 1)) + item.min;
      });

      if (currentDay > 1) {
        const rand = Math.floor(Math.random() * baseItems.length);
        bannedItemId = baseItems[rand].id;
        document.getElementById('bannedBadge').innerText = `今日禁售: ${baseItems[rand].name}`;
      } else {
        bannedItemId = null;
        document.getElementById('bannedBadge').innerText = `今日禁售: 无`;
      }
    }

    function broadcastFullState() {
      if (!roomChannel) return;
      roomChannel.send({
        type: 'broadcast',
        event: 'SYNC_STATE',
        payload: {
          currentDay,
          bannedItemId,
          marketItems: baseItems,
          players
        }
      });
    }

    function handleBuy(pName, itemId) {
      const p = players.find(x => x.name === pName);
      const item = baseItems.find(i => i.id === itemId);
      if (!p || !item) return;

      if (itemId === bannedItemId || p.coins < item.price) return;

      p.coins -= item.price;
      p.inventory[itemId] = (p.inventory[itemId] || 0) + 1;
      broadcastFullState();
      renderAll();
    }

    function handleSell(pName, itemId) {
      if (currentDay === 1) return;
      const p = players.find(x => x.name === pName);
      const item = baseItems.find(i => i.id === itemId);
      if (!p || !item) return;

      if (itemId === bannedItemId || !p.inventory[itemId] || p.inventory[itemId] <= 0) return;

      p.coins += item.price;
      p.inventory[itemId]--;
      broadcastFullState();
      renderAll();
    }

    function nextDay() {
      currentDay++;
      randomizeMarket();
      broadcastFullState();
      renderAll();
    }

    function renderAll() {
      document.getElementById('dayDisplay').innerText = `第 ${currentDay} 天`;

      // 渲染玩家列表
      const pList = document.getElementById('playerList');
      if (players.length === 0) {
        pList.innerHTML = `<div class="col-span-2 text-center py-8 text-xs text-stone-500 border border-dashed border-stone-800 rounded-xl">等待玩家手机端加入中...</div>`;
      } else {
        pList.innerHTML = players.map(p => {
          const invStr = Object.entries(p.inventory)
            .filter(([_, q]) => q > 0)
            .map(([id, q]) => `${baseItems.find(i => i.id === id)?.name || id}x${q}`)
            .join(', ') || '空';

          return `
            <div class="bg-stone-950 p-4 rounded-xl border border-stone-800">
              <div class="flex justify-between items-center mb-2">
                <span class="font-bold text-stone-100">${p.name}</span>
                <span class="text-amber-400 font-black text-xl">${p.coins} <span class="text-xs">文</span></span>
              </div>
              <div class="text-xs text-stone-400">背包持有: <span class="text-stone-300 font-medium">${invStr}</span></div>
            </div>
          `;
        }).join('');
      }

      // 渲染市场价格
      const mList = document.getElementById('marketList');
      mList.innerHTML = baseItems.map(item => {
        const isBanned = item.id === bannedItemId;
        return `
          <div class="flex justify-between items-center p-2.5 rounded-xl bg-stone-950 border ${isBanned ? 'border-rose-900 opacity-50' : 'border-stone-800'}">
            <div class="flex items-center gap-2">
              <span>${item.icon}</span>
              <span class="text-sm font-bold ${isBanned ? 'line-through text-stone-500' : 'text-stone-200'}">${item.name}</span>
            </div>
            <span class="text-sm font-black ${isBanned ? 'text-rose-400' : 'text-amber-400'}">${isBanned ? '官府查封' : item.price + ' 文'}</span>
          </div>
        `;
      }).join('');
    }

    window.onload = init;
  </script>
</body>
</html>
