<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>重返2026：主持人端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen p-4 select-none">
  <header class="flex justify-between items-center bg-stone-800 p-4 rounded-xl shadow-md mb-4 border border-stone-700">
    <div>
      <h1 class="text-2xl font-bold text-amber-500 tracking-wider">重返 2026 · 主持人控台</h1>
      <p class="text-xs text-stone-400">目标：赚取 300 铜板买回发簪</p>
    </div>
    <div class="flex items-center gap-4">
      <div class="text-center">
        <div class="text-xs text-stone-400">当前时间</div>
        <div id="dayDisplay" class="text-2xl font-black text-amber-400">第 1 天</div>
      </div>
      <button onclick="nextDay()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 px-5 rounded-lg shadow active:scale-95 transition">
        结算并进入下一天 ➔
      </button>
    </div>
  </header>

  <main class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- 玩家面板 -->
    <section class="lg:col-span-2 space-y-4">
      <div class="bg-stone-800 p-4 rounded-xl border border-stone-700">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-lg font-bold text-amber-400">玩家资产管理</h2>
          <button onclick="addPlayer()" class="bg-stone-700 hover:bg-stone-600 text-sm px-3 py-1 rounded-md text-amber-300 border border-stone-600">
            + 增加玩家
          </button>
        </div>
        <div id="playerList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>

      <!-- 快速交易核算器 -->
      <div class="bg-stone-800 p-4 rounded-xl border border-stone-700">
        <h2 class="text-lg font-bold text-amber-400 mb-3">当面交易结算器</h2>
        <div class="flex flex-wrap gap-2 items-center text-sm">
          <select id="tradePlayer" class="bg-stone-900 border border-stone-600 rounded p-2 text-amber-300"></select>
          <select id="tradeType" class="bg-stone-900 border border-stone-600 rounded p-2 text-stone-200">
            <option value="buy">买入</option>
            <option value="sell">卖出</option>
          </select>
          <select id="tradeItem" class="bg-stone-900 border border-stone-600 rounded p-2 text-stone-200"></select>
          <input id="tradeQty" type="number" value="1" min="1" class="w-16 bg-stone-900 border border-stone-600 rounded p-2 text-center text-white" />
          <span>件</span>
          <button onclick="executeTrade()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-md font-bold active:scale-95 transition">
            确认交易
          </button>
          <button onclick="salvageHalfPrice()" class="bg-rose-700 hover:bg-rose-600 text-white px-3 py-2 rounded-md text-xs">
            破产半价收回全部物品
          </button>
        </div>
      </div>
    </section>

    <!-- 市场大盘与事件抽卡 -->
    <section class="space-y-4">
      <div class="bg-stone-800 p-4 rounded-xl border border-stone-700">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-lg font-bold text-amber-400">今日东汉市价</h2>
          <span id="bannedItemBadge" class="text-xs bg-rose-900 text-rose-300 px-2 py-0.5 rounded-full border border-rose-700">今日禁售: 无</span>
        </div>
        <div id="marketList" class="space-y-2 max-h-[280px] overflow-y-auto pr-1"></div>
      </div>

      <div class="bg-stone-800 p-4 rounded-xl border border-stone-700 text-center">
        <h2 class="text-lg font-bold text-amber-400 mb-2">每日奇遇事件</h2>
        <p class="text-xs text-stone-400 mb-3">为选定玩家抽取今日遭遇</p>
        <div class="flex justify-center gap-2 mb-3">
          <select id="eventTargetPlayer" class="bg-stone-900 border border-stone-600 rounded p-2 text-amber-300 text-sm"></select>
          <button onclick="drawEvent()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-4 py-2 rounded-lg text-sm active:scale-95 transition">
            抽卡 🎴
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- 事件弹窗 -->
  <div id="eventModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-stone-800 border-2 border-amber-500 rounded-2xl max-w-lg w-full p-6 text-stone-100 shadow-2xl relative">
      <div id="eventTargetTag" class="text-xs text-amber-400 font-bold uppercase tracking-wider mb-1"></div>
      <h3 id="eventTitle" class="text-xl font-black text-amber-300 mb-2"></h3>
      <p id="eventDesc" class="text-sm text-stone-300 mb-6 leading-relaxed"></p>
      
      <div class="space-y-3">
        <button id="optABtn" onclick="resolveChoice('A')" class="w-full text-left bg-stone-700 hover:bg-stone-600 p-3 rounded-xl border border-stone-600">
          <span class="font-bold text-amber-400">选项 A：</span>
          <span id="optAText" class="text-sm"></span>
        </button>
        <button id="optBBtn" onclick="resolveChoice('B')" class="w-full text-left bg-stone-700 hover:bg-stone-600 p-3 rounded-xl border border-stone-600">
          <span class="font-bold text-amber-400">选项 B：</span>
          <span id="optBText" class="text-sm"></span>
        </button>
      </div>

      <div id="eventResultBox" class="hidden mt-4 p-3 bg-stone-900 border border-amber-500/50 rounded-lg text-sm text-amber-200"></div>
      <button id="closeEventBtn" onclick="closeModal()" class="hidden mt-4 w-full bg-amber-600 text-white font-bold py-2 rounded-lg">
        完成结算
      </button>
    </div>
  </div>

  <script>
    // 游戏核心数据
    let currentDay = 1;
    let bannedItem = null;

    const baseItems = [
      { id: "millet", name: "小米", min: 1, max: 4, price: 2 },
      { id: "dates", name: "枣", min: 2, max: 7, price: 4 },
      { id: "salt", name: "粗盐", min: 4, max: 15, price: 8 },
      { id: "chicken", name: "鸡", min: 6, max: 20, price: 12 },
      { id: "wine", name: "米酒", min: 10, max: 35, price: 20 },
      { id: "cloth", name: "麻布", min: 18, max: 60, price: 35 },
      { id: "mirror", name: "铜镜", min: 30, max: 100, price: 60 },
      { id: "silk", name: "丝绸", min: 40, max: 180, price: 100 }
    ];

    let players = [
      { id: 1, name: "玩家 1", coins: 25, role: "beggar", inventory: { millet: 2 } },
      { id: 2, name: "玩家 2", coins: 30, role: "normal", inventory: {} }
    ];

    const events = [
      {
        title: "同乡老乡？",
        desc: "一个穿汉服但踩着烂匡威球鞋的男人拦住你，低声问：'奇变偶不变？'",
        optA: "对暗号：'符号看象限！'",
        optB: "装傻：'何意啊壮士？'",
        resolve: (choice, p) => {
          if (choice === 'A') {
            p.inventory['silk'] = (p.inventory['silk'] || 0) + 1;
            return `${p.name} 对上了暗号！老乡热泪盈眶，送了一匹【丝绸】给你防身。`;
          } else {
            p.coins += 12;
            return `${p.name} 装傻充愣，对方匆忙逃走时掉了个钱袋，拾得 12 铜板。`;
          }
        }
      },
      {
        title: "时空代沟",
        desc: "老郎中正在给中暑病人放血，你脱口而出说喝淡盐水就行，老郎中怒目而视。",
        optA: "上前指导淡盐水救人",
        optB: "赶紧闭嘴溜走",
        resolve: (choice, p) => {
          if (choice === 'A') {
            p.coins += 15;
            delete p.inventory['salt'];
            return `病人苏醒，家属塞给你 15 铜板！但差役没收了你身上所有的【粗盐】。`;
          } else {
            p.coins = Math.max(0, p.coins - 5);
            return `老郎中强行卖给你一包保命散，损失 5 铜板。`;
          }
        }
      },
      {
        title: "斗鸡大赛",
        desc: "街头正在举行斗鸡，庄家高呼一赔三！",
        optA: "派出自己的【鸡】参赛",
        optB: "下注 10 铜板赌外围",
        resolve: (choice, p) => {
          if (choice === 'A') {
            if (p.inventory['chicken'] && p.inventory['chicken'] > 0) {
              p.coins += 35;
              return `你的走地鸡勇猛无匹！为你赢得 35 铜板奖金！`;
            } else {
              return `你两手空空没有鸡，被全场嘲笑，无事发生。`;
            }
          } else {
            if (Math.random() > 0.5) {
              p.coins += 25;
              return `下注获胜！赢回 25 铜板！`;
            } else {
              p.coins = Math.max(0, p.coins - 10);
              return `下注失败，赔掉了 10 铜板。`;
            }
          }
        }
      }
    ];

    let currentActiveEvent = null;

    // 初始化运行
    function init() {
      updateMarketPrices();
      renderAll();
    }

    function renderAll() {
      document.getElementById('dayDisplay').innerText = `第 ${currentDay} 天`;
      renderMarket();
      renderPlayers();
      renderDropdowns();
    }

    function updateMarketPrices() {
      baseItems.forEach(item => {
        item.price = Math.floor(Math.random() * (item.max - item.min + 1)) + item.min;
      });
      // 随机禁售一种商品（第1天不禁售）
      if (currentDay > 1) {
        const randomIndex = Math.floor(Math.random() * baseItems.length);
        bannedItem = baseItems[randomIndex].id;
        document.getElementById('bannedItemBadge').innerText = `今日禁售: ${baseItems[randomIndex].name}`;
      } else {
        bannedItem = null;
        document.getElementById('bannedItemBadge').innerText = `今日禁售: 无`;
      }
    }

    function renderMarket() {
      const el = document.getElementById('marketList');
      el.innerHTML = baseItems.map(item => {
        const isBanned = item.id === bannedItem;
        return `
          <div class="flex justify-between items-center p-2 rounded bg-stone-900 border ${isBanned ? 'border-rose-600 opacity-60' : 'border-stone-700'}">
            <span class="font-medium ${isBanned ? 'line-through text-stone-500' : 'text-stone-200'}">${item.name}</span>
            <span class="font-bold ${isBanned ? 'text-rose-400' : 'text-amber-400'}">${isBanned ? '禁售' : item.price + ' 文'}</span>
          </div>
        `;
      }).join('');
    }

    function renderPlayers() {
      const el = document.getElementById('playerList');
      el.innerHTML = players.map(p => {
        const itemsStr = Object.entries(p.inventory)
          .filter(([_, q]) => q > 0)
          .map(([id, q]) => `${baseItems.find(i => i.id === id)?.name || id}x${q}`)
          .join(', ') || '无';

        return `
          <div class="bg-stone-900 p-3 rounded-lg border ${p.coins >= 300 ? 'border-amber-400 bg-amber-950/30' : 'border-stone-700'}">
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-stone-200">${p.name} <span class="text-xs text-stone-500">(${p.role === 'beggar' ? '乞丐装' : '日常服'})</span></span>
              <span class="text-amber-400 font-extrabold text-lg">${p.coins} <span class="text-xs">文</span></span>
            </div>
            <div class="text-xs text-stone-400">背包装备: ${itemsStr}</div>
            ${p.coins >= 300 ? '<div class="text-xs text-amber-300 font-bold mt-2 animate-pulse">👑 达成300文！可买回发簪回到2026！</div>' : ''}
          </div>
        `;
      }).join('');
    }

    function renderDropdowns() {
      const pSelect = document.getElementById('tradePlayer');
      const ePSelect = document.getElementById('eventTargetPlayer');
      const itemSelect = document.getElementById('tradeItem');

      pSelect.innerHTML = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      ePSelect.innerHTML = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      itemSelect.innerHTML = baseItems.map(i => `<option value="${i.id}">${i.name} (${i.price}文)</option>`).join('');
    }

    function addPlayer() {
      const name = prompt("请输入新玩家名称:", `玩家 ${players.length + 1}`);
      if (!name) return;
      players.push({
        id: Date.now(),
        name: name,
        coins: 20,
        role: "beggar",
        inventory: {}
      });
      renderAll();
    }

    function executeTrade() {
      const pId = parseInt(document.getElementById('tradePlayer').value);
      const action = document.getElementById('tradeType').value;
      const itemId = document.getElementById('tradeItem').value;
      const qty = parseInt(document.getElementById('tradeQty').value) || 1;

      const player = players.find(p => p.id === pId);
      const item = baseItems.find(i => i.id === itemId);

      if (itemId === bannedItem) {
        alert("该物品今日被官府查封，无法买卖！");
        return;
      }

      const totalCost = item.price * qty;

      if (action === 'buy') {
        if (player.coins < totalCost) {
          alert("铜钱不足！");
          return;
        }
        player.coins -= totalCost;
        player.inventory[itemId] = (player.inventory[itemId] || 0) + qty;
      } else {
        const owned = player.inventory[itemId] || 0;
        if (owned < qty) {
          alert("玩家背包内没有足够的物品可卖！");
          return;
        }
        player.coins += totalCost;
        player.inventory[itemId] -= qty;
      }

      renderAll();
    }

    function salvageHalfPrice() {
      const pId = parseInt(document.getElementById('tradePlayer').value);
      const player = players.find(p => p.id === pId);
      if (!confirm(`确认强制以半价清空 ${player.name} 的所有物品兑换铜钱？`)) return;

      let gain = 0;
      Object.entries(player.inventory).forEach(([itemId, qty]) => {
        const item = baseItems.find(i => i.id === itemId);
        gain += Math.floor((item.price * qty) / 2);
      });
      player.inventory = {};
      player.coins += gain;
      alert(`已折算清空，返还 ${gain} 文。`);
      renderAll();
    }

    function nextDay() {
      currentDay++;
      // 每日乞丐装施舍 Roll 点
      players.forEach(p => {
        if (p.role === 'beggar') {
          const reward = Math.floor(Math.random() * 6) + 1;
          p.coins += reward;
        }
      });
      updateMarketPrices();
      renderAll();
      alert(`已进入第 ${currentDay} 天！乞丐装玩家已自动获得今日行乞铜钱。`);
    }

    // 事件系统
    function drawEvent() {
      const pId = parseInt(document.getElementById('eventTargetPlayer').value);
      const player = players.find(p => p.id === pId);
      const ev = events[Math.floor(Math.random() * events.length)];
      currentActiveEvent = { event: ev, player: player };

      document.getElementById('eventTargetTag').innerText = `受试玩家：${player.name}`;
      document.getElementById('eventTitle').innerText = ev.title;
      document.getElementById('eventDesc').innerText = ev.desc;
      document.getElementById('optAText').innerText = ev.optA;
      document.getElementById('optBText').innerText = ev.optB;

      document.getElementById('optABtn').classList.remove('hidden');
      document.getElementById('optBBtn').classList.remove('hidden');
      document.getElementById('eventResultBox').classList.add('hidden');
      document.getElementById('closeEventBtn').classList.add('hidden');

      document.getElementById('eventModal').classList.remove('hidden');
    }

    function resolveChoice(choice) {
      const { event, player } = currentActiveEvent;
      const resultText = event.resolve(choice, player);

      document.getElementById('optABtn').classList.add('hidden');
      document.getElementById('optBBtn').classList.add('hidden');
      
      const resBox = document.getElementById('eventResultBox');
      resBox.innerText = resultText;
      resBox.classList.remove('hidden');
      document.getElementById('closeEventBtn').classList.remove('hidden');
      renderAll();
    }

    function closeModal() {
      document.getElementById('eventModal').classList.add('hidden');
      currentActiveEvent = null;
    }

    // 启动
    window.onload = init;
  </script>
</body>
</html>
